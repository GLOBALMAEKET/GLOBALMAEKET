<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b32">
<title>GLOBALMAEKET | Compra fácil, vende mejor</title>
<style>
:root{--navy:#101b32;--navy2:#192944;--orange:#ff7a36;--cream:#f6f7fb;--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--white:#fff;--green:#16845b;--shadow:0 12px 35px #18233a12}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}button,input,select,textarea{font:inherit}button{cursor:pointer}.topline{background:#0b1426;color:#dbe4f2;text-align:center;padding:8px 14px;font-size:12px}.header{background:var(--navy);color:white;position:sticky;top:0;z-index:20;box-shadow:0 5px 20px #0002}.headin{max-width:1200px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:22px}.logo{font-weight:900;letter-spacing:1px;font-size:22px;white-space:nowrap}.logo span{color:var(--orange)}.search{display:flex;flex:1;background:white;border-radius:10px;overflow:hidden}.search input{border:0;outline:0;padding:12px 14px;width:100%;min-width:80px;color:#182033}.search button{border:0;background:var(--orange);color:white;padding:0 18px;font-weight:800}.navbtn{background:transparent;color:white;border:0;font-weight:650}.cartbtn{background:var(--orange);color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:800}.count{background:white;color:var(--navy);border-radius:20px;padding:2px 7px;margin-left:5px}.subnav{border-top:1px solid #ffffff20}.subnavin{max-width:1200px;margin:auto;padding:10px 22px;display:flex;gap:22px;overflow:auto}.subnav button{white-space:nowrap;background:none;border:0;color:#e7edf7;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:25px 22px}.hero{background:linear-gradient(110deg,#101b32 0%,#233b5d 58%,#e86c34 140%);border-radius:22px;color:white;padding:48px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;overflow:hidden;min-height:280px}.eyebrow{color:#ffc09e;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:1.8px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.06;margin:12px 0}.hero p{color:#dce5f2;max-width:540px;line-height:1.6}.heroart{font-size:110px;text-align:center;filter:drop-shadow(0 18px 20px #0003)}.primary,.secondary,.danger{border:0;border-radius:10px;padding:12px 17px;font-weight:800}.primary{background:var(--orange);color:white}.secondary{background:#edf1f7;color:var(--navy)}.danger{background:#fff0ed;color:#b63824}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 16px}.sectionhead h2{margin:0;font-size:24px}.muted{color:var(--muted);font-size:13px}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{background:white;border:1px solid var(--line);border-radius:15px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);font-weight:750}.cat .emoji{display:block;font-size:30px;margin-bottom:8px}.cat:hover,.product:hover{transform:translateY(-2px);box-shadow:0 14px 28px #18233a15}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s;box-shadow:var(--shadow)}.prodimg{height:175px;background:#f1f3f7;display:block;position:relative;overflow:hidden}.prodimg img{width:100%;height:100%;object-fit:cover;display:block}.tag{position:absolute;top:12px;left:12px;background:#fff;color:#b44b20;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:900}.prodinfo{padding:14px}.prodinfo h3{font-size:15px;margin:0 0 7px;min-height:38px}.price{font-size:20px;font-weight:900;color:var(--navy)}.old{font-size:12px;color:#9ca3af;text-decoration:line-through;margin-left:7px}.prodmeta{font-size:12px;color:var(--muted);margin:7px 0 12px}.prodactions{display:flex;gap:8px}.prodactions button{flex:1;padding:9px 8px;font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.page-title{margin:0 0 7px;font-size:29px}.crumb{font-size:12px;color:var(--muted);margin-bottom:16px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px}.detailvisual{background:#f1f3f7;border-radius:16px;min-height:340px;display:grid;place-items:center;overflow:hidden}.detailvisual img{width:100%;height:100%;min-height:340px;object-fit:cover}.detail h1{margin:5px 0 10px}.detailprice{font-size:30px;font-weight:900;margin:15px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #d9deea;border-radius:9px;padding:11px;background:white;width:100%;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}.qty button{border:0;background:#f2f4f8;padding:8px 13px}.qty span{padding:0 14px}.cartline{display:grid;grid-template-columns:1fr auto auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cartline strong{display:block}.total{font-size:24px;font-weight:900}.checkoutgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.payoption{border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}.payoption:has(input:checked){border-color:var(--orange);background:#fff8f4}.qrbox{background:#f3f5f9;border:1px dashed #aeb8c9;border-radius:12px;padding:16px;text-align:center}.qrplaceholder{width:min(100%,260px);height:auto;background:white;border:8px solid white;margin:12px auto;display:block}.qrplaceholder img{width:100%;height:auto;display:block}.notice{background:#fff7e9;border:1px solid #f3d9a6;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.success{background:#eaf8f1;border:1px solid #b9e6ce;padding:15px;border-radius:12px;color:#176343}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#647084;background:#f8f9fb}.status{display:inline-block;border-radius:20px;padding:4px 9px;background:#fff2df;color:#89510b;font-weight:800;font-size:11px}.footer{background:var(--navy);color:#d8e0ec;margin-top:45px;padding:35px 22px}.footerin{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.hidden{display:none!important}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111d32;color:white;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:var(--shadow)}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.adminnav button{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:9px}.adminnav button.active{background:var(--navy);color:white}.small{font-size:12px;color:var(--muted)}@media(max-width:850px){.headin{gap:10px;flex-wrap:wrap}.logo{font-size:19px}.search{order:3;flex-basis:100%}.categories{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(2,1fr)}.hero{padding:30px;grid-template-columns:1fr}.heroart{display:none}.detail,.checkoutgrid{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:18px 13px}.headin{padding:12px 13px}.subnavin{padding:9px 13px}.categories{gap:8px}.cat{padding:14px 5px;font-size:12px}.products{gap:10px}.prodimg{height:130px}.prodinfo{padding:10px}.prodinfo h3{font-size:13px}.prodactions{flex-direction:column}.hero{padding:25px 20px}.cartline{grid-template-columns:1fr auto}.cartline .lineprice{grid-column:1/-1}}
</style>
</head>
<body>
<div class="topline">GLOBALMAEKET · Compra y vende desde un solo lugar · Bolivia</div>
<header class="header">
 <div class="headin">
  <div class="logo">GLOBAL<span>MAEKET</span></div>
  <form class="search" onsubmit="event.preventDefault();searchProducts()"><input id="searchInput" placeholder="¿Qué estás buscando hoy?"><button>Buscar</button></form>
  <button class="navbtn" onclick="go('orders')">Mis pedidos</button>
  <button class="navbtn" onclick="go('account')">Mi cuenta</button>
  <button class="cartbtn" onclick="go('cart')">🛒 Carrito <span class="count" id="cartCount">0</span></button>
 </div>
 <div class="subnav"><div class="subnavin">
  <button onclick="go('home')">Inicio</button><button onclick="filterCategory('Tecnología')">Tecnología</button><button onclick="filterCategory('Moda')">Moda</button><button onclick="filterCategory('Hogar')">Hogar</button><button onclick="filterCategory('Belleza')">Belleza</button><button onclick="filterCategory('Supermercado')">Supermercado</button><button onclick="filterCategory('Gastronomía')">Gastronomía</button><button onclick="go('stores')">Tiendas</button>
 </div></div>
</header>
<main class="wrap" id="app"></main>
<footer class="footer"><div class="footerin"><div><div class="logo">GLOBAL<span>MAEKET</span></div><p class="small" style="color:#c5d0df">Tu mercado digital, más cerca de ti.</p></div><div><b>Atención al cliente</b><p class="small" style="color:#c5d0df">Pedidos · Pagos · Ayuda</p></div><div><b>Vende con nosotros</b><p class="small" style="color:#c5d0df"><a href="#" onclick="go('admin');return false" style="color:#c5d0df">Panel de administración</a></p></div><div class="small" style="color:#c5d0df">© 2026 GLOBALMAEKET</div></div></footer>
<div id="toast" class="toast hidden"></div>
<script>
const PRODUCTS=[
{id:1,photo:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=85",name:"Auriculares inalámbricos",cat:"Tecnología",price:145,old:180,emoji:"🎧",store:"Tech Bolivia",desc:"Auriculares cómodos para música, llamadas y uso diario. Incluye estuche de carga y cable USB.",stock:12,tag:"Oferta"},
{id:2,photo:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=85",name:"Reloj inteligente deportivo",cat:"Tecnología",price:220,old:260,emoji:"⌚",store:"Tech Bolivia",desc:"Reloj inteligente para acompañar tus actividades y notificaciones.",stock:8,tag:"Popular"},
{id:3,photo:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=85",name:"Mochila urbana",cat:"Moda",price:115,old:0,emoji:"🎒",store:"Moda Central",desc:"Mochila práctica para estudio, trabajo y viajes cortos.",stock:20,tag:"Nuevo"},
{id:4,photo:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=85",name:"Zapatillas casuales",cat:"Moda",price:280,old:320,emoji:"👟",store:"Moda Central",desc:"Diseño versátil para combinar con tu estilo diario.",stock:6,tag:"Oferta"},
{id:5,photo:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=85",name:"Lámpara decorativa",cat:"Hogar",price:95,old:0,emoji:"💡",store:"Casa & Estilo",desc:"Iluminación cálida para dar personalidad a tus espacios.",stock:15,tag:""},
{id:6,photo:"https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=800&q=85",name:"Set de cuidado personal",cat:"Belleza",price:130,old:150,emoji:"🧴",store:"Bella Store",desc:"Set de cuidado personal para tu rutina diaria.",stock:10,tag:"Oferta"},
{id:7,photo:"https://images.unsplash.com/photo-1548907040-4d42cfc1fdb8?auto=format&fit=crop&w=800&q=85",name:"Caja de chocolates",cat:"Gastronomía",price:75,old:0,emoji:"🍫",store:"Dulce Tentación",desc:"Una selección dulce ideal para regalar o compartir.",stock:18,tag:""},
{id:8,photo:"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=800&q=85",name:"Canasta de productos",cat:"Supermercado",price:160,old:0,emoji:"🧺",store:"Mercadito",desc:"Productos básicos seleccionados para tu hogar.",stock:9,tag:""}
];
const CATS=[["Tecnología","📱"],["Moda","👕"],["Hogar","🏠"],["Belleza","✨"],["Supermercado","🛒"],["Gastronomía","🍽️"]];
let cart=JSON.parse(localStorage.getItem("gm_cart")||"[]"),orders=JSON.parse(localStorage.getItem("gm_orders")||"[]"),currentProduct=null,detailQty=1,adminTab="orders";
const money=n=>"Bs "+Number(n).toFixed(2);
function save(){localStorage.setItem("gm_cart",JSON.stringify(cart));localStorage.setItem("gm_orders",JSON.stringify(orders));updateCount()}
function updateCount(){document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2200)}
function go(page){if(page==="home")home();else if(page==="cart")showCart();else if(page==="checkout")checkout();else if(page==="orders")showOrders();else if(page==="account")account();else if(page==="stores")stores();else if(page==="admin")admin();else if(page==="detail"&&currentProduct)detail(currentProduct)}
function home(){document.getElementById("app").innerHTML=`
<section class="hero"><div><div class="eyebrow">Bienvenido a tu mercado digital</div><h1>Todo lo que buscas.<br>En un solo lugar.</h1><p>Descubre productos de diferentes tiendas, compara opciones y realiza tu pedido de forma sencilla.</p><button class="primary" onclick="document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})">Explorar productos</button></div><div class="heroart">🛍️</div></section>
<div class="sectionhead"><div><h2>Compra por categorías</h2><div class="muted">Encuentra rápidamente lo que necesitas</div></div></div>
<div class="categories">${CATS.map(c=>`<button class="cat" onclick="filterCategory('${c[0]}')"><span class="emoji">${c[1]}</span>${c[0]}</button>`).join("")}</div>
<div class="sectionhead" id="catalogo"><div><h2>Productos destacados</h2><div class="muted">Selección de ejemplo · Precios en bolivianos</div></div><button class="secondary" onclick="renderProducts(PRODUCTS)">Ver todos</button></div>
<div id="productGrid" class="products">${productCards(PRODUCTS)}</div>
<div class="sectionhead"><div><h2>Compra con confianza</h2><div class="muted">Tu pedido, tus datos y tu comprobante en un mismo flujo.</div></div></div>
<div class="panel row" style="justify-content:space-around"><span>🔒 Datos de pedido</span><span>📦 Seguimiento local</span><span>💳 QR o efectivo</span><span>🏪 Varias tiendas</span></div>`}
function productCards(list){return list.map(p=>`<article class="product"><div class="prodimg"><img src="${p.photo}" alt="${p.name}" loading="lazy">${p.tag?`<span class="tag">${p.tag}</span>`:""}</div><div class="prodinfo"><h3>${p.name}</h3><div class="price">${money(p.price)}${p.old?`<span class="old">${money(p.old)}</span>`:""}</div><div class="prodmeta">${p.cat} · ${p.store}</div><div class="prodactions"><button class="secondary" onclick="openProduct(${p.id})">Ver detalles</button><button class="primary" onclick="addCart(${p.id})">Añadir</button></div></div></article>`).join("")}
function renderProducts(list){let g=document.getElementById("productGrid");if(g)g.innerHTML=list.length?productCards(list):'<div class="empty">No encontramos productos con esa búsqueda.</div>'}
function filterCategory(c){home();document.getElementById("productGrid").innerHTML=productCards(PRODUCTS.filter(p=>p.cat===c));document.getElementById("catalogo").scrollIntoView({behavior:"smooth"})}
function searchProducts(){let q=document.getElementById("searchInput").value.toLowerCase().trim();home();renderProducts(PRODUCTS.filter(p=>(p.name+" "+p.cat+" "+p.store).toLowerCase().includes(q)));document.getElementById("catalogo").scrollIntoView({behavior:"smooth"})}
function openProduct(id){currentProduct=PRODUCTS.find(p=>p.id===id);detailQty=1;detail(currentProduct)}
function detail(p){document.getElementById("app").innerHTML=`<div class="crumb"><button class="navbtn" style="color:#586174" onclick="home()">Inicio</button> / ${p.cat} / ${p.name}</div><section class="panel detail"><div class="detailvisual"><img src="${p.photo}" alt="${p.name}"></div><div><div class="eyebrow" style="color:var(--orange)">${p.store}</div><h1>${p.name}</h1><div class="muted">Categoría: ${p.cat} · Disponibles: ${p.stock}</div><div class="detailprice">${money(p.price)} ${p.old?`<span class="old">${money(p.old)}</span>`:""}</div><p style="line-height:1.7;color:#596477">${p.desc}</p><div class="field"><label>Presentación / variante</label><select id="variant"><option>Estándar</option><option>Color sujeto a disponibilidad</option><option>Consultar al vendedor</option></select></div><div class="row"><div class="qty"><button onclick="changeQty(-1)">−</button><span id="detailQty">1</span><button onclick="changeQty(1)">+</button></div><button class="primary" onclick="addCart(${p.id},detailQty)">Añadir al carrito</button></div><p class="small">Las imágenes y productos de esta primera versión son demostrativos. Sustitúyelos por tus productos reales antes de publicar.</p></div></section><div class="sectionhead"><h2>También te puede interesar</h2></div><div class="products">${productCards(PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4))}</div>`}
function changeQty(n){detailQty=Math.max(1,Math.min(20,detailQty+n));document.getElementById("detailQty").textContent=detailQty}
function addCart(id,qty=1){let p=PRODUCTS.find(x=>x.id===id),line=cart.find(x=>x.id===id);if(line)line.qty=Math.min(20,line.qty+qty);else cart.push({id:p.id,qty,variant:"Estándar"});save();toast("Producto añadido al carrito")}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();showCart()}
function subtotal(){return cart.reduce((s,l)=>s+PRODUCTS.find(p=>p.id===l.id).price*l.qty,0)}
function showCart(){if(!cart.length){document.getElementById("app").innerHTML='<div class="panel empty"><div style="font-size:55px">🛒</div><b>Tu carrito está vacío</b>Explora el catálogo y añade tus productos.<p><button class="primary" onclick="home()">Ir a comprar</button></p></div>';return}
document.getElementById("app").innerHTML=`<h1 class="page-title">Mi carrito</h1><p class="muted">Revisa tus productos antes de continuar.</p><div class="panel">${cart.map(l=>{let p=PRODUCTS.find(x=>x.id===l.id);return `<div class="cartline"><div><strong>${p.emoji} ${p.name}</strong><span class="small">${p.store} · ${money(p.price)} por unidad</span></div><div class="qty"><button onclick="cartQty(${p.id},-1)">−</button><span>${l.qty}</span><button onclick="cartQty(${p.id},1)">+</button></div><div class="lineprice"><b>${money(p.price*l.qty)}</b><br><button class="danger" style="padding:5px 8px;margin-top:5px" onclick="removeCart(${p.id})">Quitar</button></div></div>`}).join("")}<div class="row" style="justify-content:space-between;padding-top:18px"><button class="secondary" onclick="home()">Seguir comprando</button><div class="total">Total: ${money(subtotal())}</div><button class="primary" onclick="checkout()">Continuar al pago</button></div></div>`}
function cartQty(id,n){let l=cart.find(x=>x.id===id);l.qty=Math.max(1,Math.min(20,l.qty+n));save();showCart()}
function checkout(){if(!cart.length){showCart();return}let total=subtotal();document.getElementById("app").innerHTML=`<h1 class="page-title">Finalizar pedido</h1><p class="muted">Completa tus datos y selecciona tu forma de pago.</p><div class="checkoutgrid"><section class="panel"><h2>1. Datos de entrega</h2><form id="orderForm" onsubmit="event.preventDefault();placeOrder()"><div class="field"><label>Nombre completo *</label><input id="custName" required placeholder="Tu nombre y apellido"></div><div class="field"><label>Teléfono / WhatsApp *</label><input id="custPhone" required inputmode="tel" placeholder="Ej. 7XXXXXXX"></div><div class="field"><label>Correo electrónico (opcional)</label><input id="custEmail" type="email" placeholder="tucorreo@ejemplo.com"></div><div class="field"><label>Departamento *</label><select id="custDept" required><option value="">Selecciona</option><option>Santa Cruz</option><option>La Paz</option><option>Cochabamba</option><option>Chuquisaca</option><option>Tarija</option><option>Oruro</option><option>Potosí</option><option>Beni</option><option>Pando</option></select></div><div class="field"><label>Ciudad / zona *</label><input id="custCity" required placeholder="Ciudad, barrio o zona"></div><div class="field"><label>Dirección de entrega *</label><textarea id="custAddress" required placeholder="Calle, número, referencias..."></textarea></div><div class="field"><label>Indicaciones adicionales</label><textarea id="custNotes" placeholder="Horario preferido u otra indicación"></textarea></div><h2>2. Forma de pago</h2><label class="payoption"><input type="radio" name="payment" value="QR" checked onchange="paymentChanged()"><span><b>Pago por QR / transferencia</b><br><span class="small">Muestra los datos QR y adjunta tu comprobante.</span></span></label><label class="payoption"><input type="radio" name="payment" value="Efectivo" onchange="paymentChanged()"><span><b>Pago en efectivo</b><br><span class="small">Pagarás al recibir o recoger el pedi function paymentChanged(){document.getElementById("qrInstructions").classList.toggle("hidden",document.querySelector('input[name="payment"]:checked').value!=="QR")}
function placeOrder(){let payment=document.querySelector('input[name="payment"]:checked').value,file=document.getElementById("receipt").files[0];if(payment==="QR"&&!file){if(!confirm("No has adjuntado el comprobante. ¿Quieres continuar igualmente?"))return}
let data={id:"GM-"+Date.now().toString().slice(-8),date:new Date().toLocaleString("es-BO"),name:document.getElementById("custName").value,phone:document.getElementById("custPhone").value,email:document.getElementById("custEmail").value,dept:document.getElementById("custDept").value,city:document.getElementById("custCity").value,address:document.getElementById("custAddress").value,notes:document.getElementById("custNotes").value,payment,status:payment==="QR"?"Pendiente de verificar pago":"Pendiente de coordinación",total:subtotal(),items:cart.map(l=>({...l,name:PRODUCTS.find(p=>p.id===l.id).name,price:PRODUCTS.find(p=>p.id===l.id).price})),receiptName:file?file.name:""};
function finish(receiptData){data.receipt=receiptData||"";orders.unshift(data);cart=[];save();document.getElementById("app").innerHTML=`<div class="panel"><div class="success"><h2>¡Pedido registrado!</h2><p>Tu número de pedido es <b>${data.id}</b>.</p><p>Forma de pago: ${data.payment}. Estado: ${data.status}.</p></div><p>Guarda tu número de pedido. La tienda deberá confirmar contigo la entrega y el pago.</p><button class="primary" onclick="showOrders()">Ver mis pedidos</button> <button class="secondary" onclick="home()">Volver al inicio</button></div>`}
if(file){let reader=new FileReader();reader.onload=()=>finish(reader.result);reader.readAsDataURL(file)}else finish("")}
function showOrders(){document.getElementById("app").innerHTML=`<h1 class="page-title">Mis pedidos</h1><p class="muted">Pedidos registrados en este navegador.</p>${orders.length?`<div class="panel tablewrap"><table><thead><tr><th>N.º pedido</th><th>Fecha</th><th>Total</th><th>Pago</th><th>Estado</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b><br><span class="small">${o.name}</span></td><td>${o.date}</td><td>${money(o.total)}</td><td>${o.payment}</td><td><span class="status">${o.status}</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="panel empty"><b>Aún no tienes pedidos</b>Cuando realices una compra, aparecerá aquí.</div>'}`}
function account(){document.getElementById("app").innerHTML=`<h1 class="page-title">Mi cuenta</h1><div class="panel"><h2>Tu espacio de cliente</h2><p>En esta primera entrega puedes consultar tus pedidos guardados en este dispositivo.</p><div class="row"><button class="primary" onclick="showOrders()">Consultar mis pedidos</button><button class="secondary" onclick="go('admin')">Administración de demostración</button></div><p class="notice">Todavía no hay registro ni inicio de sesión real. No introduzcas contraseñas ni datos sensibles en esta versión.</p></div>`}
function stores(){let names=[...new Set(PRODUCTS.map(p=>p.store))];document.getElementById("app").innerHTML=`<h1 class="page-title">Tiendas participantes</h1><p class="muted">Tiendas de demostración. Puedes reemplazarlas por vendedores reales.</p><div class="products">${names.map(n=>`<div class="panel"><div style="font-size:35px">🏪</div><h3>${n}</h3><p class="small">${PRODUCTS.filter(p=>p.store===n).length} productos publicados</p><button class="secondary" onclick="home();renderProducts(PRODUCTS.filter(p=>p.store==='${n}'))">Ver productos</button></div>`).join("")}</div>`}
function updateOrder(i,key,value){orders[i][key]=value;localStorage.setItem("gm_orders",JSON.stringify(orders));toast("Pedido actualizado")}
function sendOrderWhatsApp(i){let o=orders[i],msg=document.getElementById("msg-"+i).value.trim();o.message=msg;localStorage.setItem("gm_orders",JSON.stringify(orders));let phone=(o.phone||"").replace(/\D/g,"");if(phone.length<7){toast("El teléfono del cliente no parece válido");return}let date=o.deliveryDate?new Date(o.deliveryDate+"T12:00:00").toLocaleDateString("es-BO"):"por confirmar";let text=`Hola ${o.name}. Te actualizamos tu pedido ${o.id} de GLOBALMAEKET. Estado: ${o.status}. Fecha estimada de entrega: ${date}. ${msg}`;window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(text),"_blank")}
function admin(){document.getElementById("app").innerHTML=`<h1 class="page-title">Panel de administración</h1><p class="muted">Panel local de demostración · no está protegido con contraseña.</p><div class="adminnav"><button class="${adminTab==='orders'?'active':''}" onclick="adminTab='orders';admin()">Pedidos</button><button class="${adminTab==='payment'?'active':''}" onclick="adminTab='payment';admin()">Datos de pago</button><button class="${adminTab==='products'?'active':''}" onclick="adminTab='products';admin()">Productos</button></div><div id="adminContent" class="panel"></div>`;
let c=document.getElementById("adminContent");
if(adminTab==="orders")c.innerHTML=`<h2>Control de pedidos</h2><p class="notice">Aquí puedes gestionar los pedidos guardados en este mismo navegador. Para recibir pedidos de clientes desde otros teléfonos necesitaremos conectar una base de datos y publicar el sitio.</p>${orders.length?orders.map((o,i)=>`<article class="panel" style="margin:14px 0;background:#fbfcfe"><div class="row" style="justify-content:space-between"><div><b>${o.id}</b><div class="small">${o.date}</div></div><span class="status">${o.status||'Pendiente'}</span></div><h3>${o.name}</h3><p>📞 ${o.phone} · ${o.email||'Sin correo'}<br>📍 ${o.dept}, ${o.city}<br>${o.address}<br><b>Total: ${money(o.total)}</b> · Pago: ${o.payment}</p><p class="small">${(o.items||[]).map(x=>`${x.name} × ${x.qty}`).join(' · ')}</p><div class="row">${o.receipt?`<a href="${o.receipt}" target="_blank" class="secondary" style="padding:9px;border-radius:8px">Ver comprobante</a>`:'<span class="small">Sin comprobante adjunto</span>'}</div><div class="field"><label>Estado del pedido</label><select id="status-${i}" onchange="updateOrder(${i},'status',this.value)"><option ${o.status==='Pendiente de verificar pago'?'selected':''}>Pendiente de verificar pago</option><option ${o.status==='Pago confirmado'?'selected':''}>Pago confirmado</option><option ${o.status==='Preparando pedido'?'selected':''}>Preparando pedido</option><option ${o.status==='En camino'?'selected':''}>En camino</option><option ${o.status==='Listo para recoger'?'selected':''}>Listo para recoger</option><option ${o.status==='Entregado'?'selected':''}>Entregado</option><option ${o.status==='Cancelado'?'selected':''}>Cancelado</option></select></div><div class="field"><label>Fecha estimada de entrega</label><input type="date" value="${o.deliveryDate||''}" onchange="updateOrder(${i},'deliveryDate',this.value)"></div><div class="field"><label>Mensaje para el cliente</label><textarea id="msg-${i}" placeholder="Ej. Tu pedido llegará el jueves entre 15:00 y 17:00.">${o.message||''}</textarea></div><button class="primary" onclick="sendOrderWhatsApp(${i})">Enviar actualización por WhatsApp</button></article>`).join(''):'<p class="empty">Todavía no hay pedidos registrados en este navegador.</p>'}<button class="danger" onclick="if(confirm('¿Borrar todos los pedidos guardados en este navegador?')){orders=[];save();admin()}">Borrar pedidos locales</button>`;
if(adminTab==="payment")c.innerHTML=`<h2>Configurar tus datos de pago</h2><p class="small">Edita el texto y coloca la imagen QR en el código HTML, en la sección indicada. Esta configuración es solo visual en esta versión.</p><div class="field"><label>Titular de la cuenta</label><input value="EDITAR NOMBRE DEL TITULAR" readonly></div><div class="field"><label>Banco</label><input value="EDITAR NOMBRE DEL BANCO" readonly></div><div class="field"><label>Cuenta / referencia</label><input value="EDITAR DATOS" readonly></div><div class="notice">Para cambiar estos datos, busca en el archivo index.html el texto “EDITAR NOMBRE” y reemplázalo. Para el QR, busca “AQUÍ COLOCAR IMAGEN DEL QR” y sustituye el recuadro por tu imagen.</div>`;
if(adminTab==="products")c.innerHTML=`<h2>Catálogo actual</h2><p>Hay ${PRODUCTS.length} productos de ejemplo. Para cambiar nombres, precios, categorías e imágenes ilustrativas, edita la constante PRODUCTS al inicio del JavaScript.</p><div class="tablewrap"><table><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Tienda</th></tr>${PRODUCTS.map(p=>`<tr><td>${p.name}</td><td>${p.cat}</td><td>${money(p.price)}</td><td>${p.store}</td></tr>`).join("")}</table></div>`;
}
home();updateCount();
</script>
